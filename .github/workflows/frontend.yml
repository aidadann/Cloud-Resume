name: Deploy Frontend to Azure

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/**' # Only runs if frontend files change

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Upload to Blob Storage
      uses: azure/CLI@v2
      with:
        azcliversion: latest
        inlineScript: |
            az storage blob upload-batch --account-name stcloudresumeaidaniac --auth-mode key -d '$web' -s frontend/ --overwrite
